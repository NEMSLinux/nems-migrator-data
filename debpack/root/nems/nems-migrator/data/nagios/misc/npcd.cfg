# NPCD.cfg - NEMS Linux / PNP4Nagios Configuration

# Privilege Options
user = nagios
group = nagios

#########################
# Logging Options       #
#########################

# Log type ('file' or 'syslog')
log_type = file

# Corrected log file location directly in /var/
log_file = /usr/local/pnp4nagios/var/npcd.log

# Maximum filesize (bytes) before log rotation (10MB)
max_logfile_size = 10485760

# Log level: 1 = Basic activity logging (recommended to verify processing)
log_level = 1

#########################
# NEEDED OPTIONS        #
#########################

# Corrected spool directory (where Nagios moves perfdata files)
perfdata_spool_dir = /usr/local/pnp4nagios/var/spool/

# Command executed for each spooled file
perfdata_file_run_cmd = /usr/local/pnp4nagios/libexec/process_perfdata.pl

# Execution arguments
perfdata_file_run_cmd_args = --bulk

# Append '-n' flag to the command
identify_npcd = 1

# Parallel worker threads
npcd_max_threads = 5

# Seconds to wait between directory scans
sleep_time = 15

# System load limit for starting new threads (0.0 = disabled)
load_threshold = 0.0

# Location of PID file
pid_file = /usr/local/pnp4nagios/var/npcd.pid

#########################
# NPCDMOD OPTIONS       #
#########################

perfdata_file = /usr/local/pnp4nagios/var/perfdata.dump
perfdata_spool_filename = perfdata
perfdata_file_processing_interval = 15
