# Nagios Core Apache Configuration
# Managed for NEMS Linux SSO Integration

ScriptAlias /nagios/cgi-bin "/usr/local/nagios/sbin"
Alias /nagios "/usr/local/nagios/share"

# Enforce NEMS Lua SSO Authentication
<Location /nagios>
    LuaHookAccessChecker /etc/apache2/nems_sso.lua nems_require_reporter
</Location>

<Directory "/usr/local/nagios/sbin">
    Options ExecCGI
    AllowOverride None
    Require all granted
</Directory>

<Directory "/usr/local/nagios/share">
    Options None
    AllowOverride None
    Require all granted
</Directory>
