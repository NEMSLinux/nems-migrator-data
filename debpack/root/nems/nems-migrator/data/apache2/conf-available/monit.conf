# Enable SSL proxying globally for this configuration
SSLProxyEngine On
SSLProxyVerify none
SSLProxyCheckPeerCN off
SSLProxyCheckPeerName off
SSLProxyCheckPeerExpire off

RedirectMatch 301 ^/monit$ /monit/

<Location /monit/>
    # Enforce NEMS SSO
    LuaHookAccessChecker /etc/apache2/nems_sso.lua nems_require_operator

    # Automatically inject nemssso credentials in Base64
    RequestHeader set Authorization "Basic bmVtc3NzbzpOZW1zU1MwX01vbml0X1Bhc3NfMjAyNiEj"

    # Rewrite Host header and disable connection pooling/keep-alive
    ProxyPreserveHost Off
    RequestHeader set Host "127.0.0.1:2812"
    SetEnv proxy-nokeepalive 1
    SetEnv proxy-initial-not-pooled 1

    # Reverse proxy over HTTPS to backend Monit
    ProxyPass https://127.0.0.1:2812/ disablereuse=On
    ProxyPassReverse https://127.0.0.1:2812/
</Location>
